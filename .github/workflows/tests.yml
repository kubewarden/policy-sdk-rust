on:
  - push
  - pull_request
  - workflow_call

name: Continuous integration

env:
  # Used by jobs that don't loop over multiple versions (clippy, doc, fmt).
  # check and test use the Makefile targets which iterate over KUBE_API_VERSIONS.
  K8S_OPENAPI_ENABLED_VERSION: "1.36"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup rust toolchain
        run: |
          rustup toolchain install stable --profile minimal 
          rustup override set stable
      - name: Run cargo check across supported API versions
        run: make check-all-versions

  spelling:
    name: Spelling check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check spelling with typos
        uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup rust toolchain
        run: |
          rustup toolchain install stable --profile minimal 
          rustup override set stable
      - name: Run test suite across supported API versions
        run: make test-all-versions

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup rust toolchain
        run: |
          rustup toolchain install stable --profile minimal 
          rustup override set stable
      - run: rustup component add rustfmt
      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup rust toolchain
        run: |
          rustup toolchain install stable --profile minimal 
          rustup override set stable
      - run: rustup component add clippy
      - name: Run cargo clippy
        run: cargo clippy -- -D warnings

  doc:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rustup (nightly)
        run: |
          rustup install --profile minimal nightly
          rustup override set nightly
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: |
          make doc
